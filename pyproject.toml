[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ethnoevidence-temporal-audit"
version = "2.0.2"
description = "Frozen, evidence-gated temporal audit for reproducible multicomponent target prioritization."
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
dependencies = [
    "requests>=2.28",
    "beautifulsoup4>=4.12",
    "matplotlib>=3.7",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["ethno_evidence*"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]
